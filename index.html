<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pulse — share the moment</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FAFAFA;
    --surface:#FFFFFF;
    --border:#DBDBDB;
    --text:#262626;
    --text-soft:#737373;
    --text-faint:#C7C7C7;
    --accent-a:#F58529;
    --accent-b:#DD2A7B;
    --accent-c:#8134AF;
    --accent-d:#515BD4;
    --ring: linear-gradient(45deg, var(--accent-a), var(--accent-b) 45%, var(--accent-c) 70%, var(--accent-d));
    --like:#ED4956;
    --radius:12px;
    --shadow: 0 1px 2px rgba(0,0,0,.06);
  }
  html.dark{
    --bg:#000000;
    --surface:#121212;
    --border:#262626;
    --text:#F5F5F5;
    --text-soft:#A8A8A8;
    --text-faint:#4b4b4b;
    --shadow: 0 1px 2px rgba(0,0,0,.4);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
    -webkit-font-smoothing:antialiased;
    padding-bottom:64px;
  }
  a{color:inherit;text-decoration:none;}
  button{font-family:inherit;cursor:pointer;}

  /* ---------- Top bar ---------- */
  .topbar{
    position:sticky;top:0;z-index:50;
    background:var(--surface);
    border-bottom:1px solid var(--border);
  }
  .topbar-inner{
    max-width:975px;margin:0 auto;
    display:flex;align-items:center;justify-content:space-between;
    padding:10px 20px;
    gap:10px;
  }
  .logo{
    font-family:'Poppins',sans-serif;font-weight:700;font-size:22px;letter-spacing:.2px;
    background:var(--ring);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    flex-shrink:0;
  }
  .search{
    display:none;
    align-items:center;gap:8px;
    background:var(--bg);border:1px solid var(--border);border-radius:8px;
    padding:8px 12px;color:var(--text-soft);font-size:14px;flex:1;max-width:270px;margin:0 24px;
  }
  .search input{background:none;border:none;outline:none;color:var(--text);width:100%;font-size:14px;}
  .top-icons{display:flex;align-items:center;gap:16px;}
  .icon-btn{background:none;border:none;color:var(--text);padding:4px;display:flex;position:relative;}
  .icon-btn svg{width:23px;height:23px;}
  .icon-btn.active svg{fill:var(--text);}
  .badge-dot{position:absolute;top:0;right:0;width:8px;height:8px;border-radius:50%;background:var(--like);border:1.5px solid var(--surface);}
  .avatar-btn{width:26px;height:26px;border-radius:50%;overflow:hidden;border:1px solid var(--border);padding:0;}
  .avatar-btn img{width:100%;height:100%;object-fit:cover;}

  /* ---------- Layout ---------- */
  .app{max-width:975px;margin:0 auto;display:flex;gap:28px;padding:20px 12px;align-items:flex-start;}
  .main-col{flex:1;max-width:470px;margin:0 auto;min-width:0;}
  .side-col{width:320px;padding-top:8px;display:none;flex-shrink:0;}
  .app.full .main-col{max-width:700px;}
  .app.full .side-col{display:none !important;}
  .app.wide .main-col{max-width:630px;}

  /* ---------- Stories ---------- */
  .stories{
    display:flex;gap:14px;overflow-x:auto;padding:16px 4px 20px;
    scrollbar-width:none;
  }
  .stories::-webkit-scrollbar{display:none;}
  .story{display:flex;flex-direction:column;align-items:center;gap:6px;flex-shrink:0;width:64px;background:none;border:none;}
  .story-ring{
    width:60px;height:60px;border-radius:50%;
    background:var(--ring);
    padding:2.5px;display:flex;align-items:center;justify-content:center;position:relative;
  }
  .story-ring.seen{background:var(--border);}
  .story-ring.empty{background:var(--border);}
  .story-ring-inner{
    width:100%;height:100%;border-radius:50%;background:var(--surface);
    padding:2px;
  }
  .story img{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block;}
  .story span{font-size:11.5px;color:var(--text);max-width:64px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .plus-badge{
    position:absolute;bottom:-2px;right:-2px;
    width:18px;height:18px;border-radius:50%;
    background:var(--accent-d);color:#fff;font-size:13px;font-weight:700;
    display:flex;align-items:center;justify-content:center;
    border:2px solid var(--surface);
  }

  /* ---------- Post card ---------- */
  .post{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius);
    margin-bottom:24px;
  }
  .post-head{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;}
  .post-user{display:flex;align-items:center;gap:10px;}
  .post-user img{width:32px;height:32px;border-radius:50%;object-fit:cover;}
  .post-user .names{display:flex;flex-direction:column;line-height:1.25;}
  .post-user .uname{font-size:13.5px;font-weight:600;}
  .post-user .loc{font-size:11.5px;color:var(--text-soft);}
  .more-btn{background:none;border:none;color:var(--text);}
  .post-media{width:100%;aspect-ratio:1/1;background:var(--bg);overflow:hidden;position:relative;user-select:none;}
  .post-media img{width:100%;height:100%;object-fit:cover;display:block;}
  .burst{
    position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) scale(0);
    pointer-events:none;
  }
  .burst svg{width:90px;height:90px;fill:#fff;filter:drop-shadow(0 2px 6px rgba(0,0,0,.35));}
  .burst.play{animation:burst .75s ease forwards;}
  @keyframes burst{
    0%{opacity:0;transform:translate(-50%,-50%) scale(.3);}
    25%{opacity:1;transform:translate(-50%,-50%) scale(1.15);}
    45%{transform:translate(-50%,-50%) scale(.95);}
    80%{opacity:1;}
    100%{opacity:0;transform:translate(-50%,-50%) scale(1);}
  }
  .post-actions{display:flex;align-items:center;justify-content:space-between;padding:10px 14px 0;}
  .action-left{display:flex;gap:14px;}
  .action-btn{background:none;border:none;padding:2px;color:var(--text);}
  .action-btn svg{width:25px;height:25px;transition:transform .12s ease;}
  .action-btn:active svg{transform:scale(1.2);}
  .action-btn.liked svg{fill:var(--like);stroke:var(--like);}
  .action-btn.saved svg{fill:var(--text);}
  .post-likes{padding:8px 14px 0;font-size:13.5px;font-weight:600;}
  .post-caption{padding:6px 14px 0;font-size:14px;line-height:1.4;}
  .post-caption .cap-uname{font-weight:600;margin-right:6px;}
  .post-comments-link{padding:6px 14px 0;font-size:13.5px;color:var(--text-soft);background:none;border:none;display:block;}
  .post-comment-list{padding:4px 14px 0;}
  .post-comment-list .c{font-size:13.5px;margin-bottom:3px;}
  .post-comment-list .c b{font-weight:600;margin-right:6px;}
  .post-time{padding:8px 14px 4px;font-size:11px;color:var(--text-soft);letter-spacing:.2px;}
  .add-comment{
    display:flex;align-items:center;gap:10px;
    border-top:1px solid var(--border);padding:10px 14px;margin-top:8px;
  }
  .add-comment input{
    flex:1;border:none;background:none;outline:none;color:var(--text);font-size:14px;
  }
  .add-comment button{background:none;border:none;color:var(--accent-d);font-weight:600;font-size:13.5px;opacity:.4;}
  .add-comment button.enabled{opacity:1;}

  /* ---------- Side column ---------- */
  .side-profile{display:flex;align-items:center;gap:14px;padding:8px 0 20px;}
  .side-profile img{width:56px;height:56px;border-radius:50%;object-fit:cover;}
  .side-profile .u{font-weight:600;font-size:14px;}
  .side-profile .n{color:var(--text-soft);font-size:13.5px;}
  .side-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;}
  .side-head span:first-child{color:var(--text-soft);font-weight:600;font-size:13.5px;}
  .side-head button{background:none;border:none;font-size:12.5px;font-weight:600;color:var(--text);}
  .suggestion{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
  .suggestion .l{display:flex;align-items:center;gap:12px;}
  .suggestion img{width:32px;height:32px;border-radius:50%;object-fit:cover;}
  .suggestion .u{font-size:13px;font-weight:600;}
  .suggestion .n{font-size:12px;color:var(--text-soft);}
  .suggestion button{background:none;border:none;color:var(--accent-d);font-weight:600;font-size:12px;}
  .side-footer{margin-top:26px;font-size:11.5px;color:var(--text-faint);line-height:1.8;}

  /* ---------- Bottom nav (mobile) ---------- */
  .bottomnav{
    position:fixed;bottom:0;left:0;right:0;z-index:50;
    background:var(--surface);border-top:1px solid var(--border);
    display:flex;justify-content:space-around;align-items:center;padding:10px 0;
  }
  .bottomnav button{background:none;border:none;color:var(--text);}
  .bottomnav button.active svg{fill:var(--text);}
  .bottomnav img.nav-avatar{width:24px;height:24px;border-radius:50%;object-fit:cover;}

  /* ---------- Generic modal ---------- */
  .modal-overlay{
    position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:100;
    display:none;align-items:center;justify-content:center;padding:20px;
    overflow-y:auto;
  }
  .modal-overlay.open{display:flex;}
  .modal{
    background:var(--surface);border-radius:var(--radius);width:100%;max-width:420px;overflow:hidden;
    box-shadow:0 10px 40px rgba(0,0,0,.3);
    margin:auto;
  }
  .modal-head{
    display:flex;align-items:center;justify-content:space-between;
    padding:14px 16px;border-bottom:1px solid var(--border);
  }
  .modal-head h3{margin:0;font-size:15px;}
  .modal-head button{background:none;border:none;font-size:20px;color:var(--text);line-height:1;}
  .modal-body{padding:18px 16px;}
  .tabs{display:flex;gap:8px;margin-bottom:16px;}
  .tab-btn{flex:1;padding:8px;border-radius:8px;border:1px solid var(--border);background:none;color:var(--text-soft);font-size:13.5px;font-weight:600;}
  .tab-btn.active{background:var(--text);color:var(--surface);border-color:var(--text);}
  .drop-zone{
    border:2px dashed var(--border);border-radius:10px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:10px;padding:34px 14px;color:var(--text-soft);text-align:center;cursor:pointer;
  }
  .drop-zone svg{width:44px;height:44px;opacity:.5;}
  .drop-zone input{display:none;}
  .preview-img{width:100%;border-radius:10px;max-height:280px;object-fit:cover;margin-bottom:12px;}
  .modal textarea{
    width:100%;border:1px solid var(--border);border-radius:8px;background:var(--bg);
    color:var(--text);padding:10px;font-family:inherit;font-size:14px;resize:none;min-height:70px;outline:none;
  }
  .share-btn{
    width:100%;margin-top:14px;padding:10px;border:none;border-radius:8px;
    background:var(--accent-d);color:#fff;font-weight:600;font-size:14px;
  }
  .share-btn:disabled{opacity:.4;cursor:default;}

  /* post-viewer modal (reuses .post look, wider) */
  #post-modal .modal{max-width:480px;background:transparent;box-shadow:none;position:relative;}
  #post-modal .post{margin-bottom:0;max-height:88vh;overflow-y:auto;}
  #post-modal-close{
    position:fixed;top:18px;right:22px;background:rgba(0,0,0,.5);border:none;color:#fff;
    font-size:24px;line-height:1;width:38px;height:38px;border-radius:50%;z-index:101;
  }

  /* ---------- Story viewer ---------- */
  .story-viewer{
    position:fixed;inset:0;background:#000;z-index:300;display:none;flex-direction:column;
  }
  .story-viewer.open{display:flex;}
  .sv-bars{display:flex;gap:4px;padding:10px 10px 0;}
  .sv-bar{flex:1;height:2.5px;background:rgba(255,255,255,.35);border-radius:2px;overflow:hidden;}
  .sv-bar-fill{height:100%;width:0%;background:#fff;}
  .sv-bar-fill.done{width:100%;}
  .sv-bar-fill.playing{animation:svfill linear forwards;}
  @keyframes svfill{ from{width:0%;} to{width:100%;} }
  .sv-head{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;}
  .sv-user{display:flex;align-items:center;gap:10px;color:#fff;}
  .sv-user img{width:30px;height:30px;border-radius:50%;object-fit:cover;}
  .sv-user .t{font-size:12px;color:rgba(255,255,255,.7);margin-left:6px;}
  .sv-close{background:none;border:none;color:#fff;font-size:24px;}
  .sv-stage{flex:1;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden;}
  .sv-stage img{max-width:100%;max-height:100%;object-fit:contain;}
  .sv-tap{position:absolute;top:0;bottom:0;width:50%;background:none;border:none;}
  .sv-tap.left{left:0;}
  .sv-tap.right{right:0;}
  .sv-foot{display:flex;align-items:center;gap:10px;padding:12px 14px;}
  .sv-foot input{
    flex:1;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.3);border-radius:20px;
    padding:10px 16px;color:#fff;outline:none;font-size:14px;
  }
  .sv-foot input::placeholder{color:rgba(255,255,255,.6);}
  .sv-foot button{background:none;border:none;color:#fff;}
  .sv-foot svg{width:26px;height:26px;}

  /* ---------- Explore ---------- */
  .explore-search{
    display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--border);
    border-radius:8px;padding:9px 12px;margin:16px 4px;color:var(--text-soft);
  }
  .explore-search input{border:none;background:none;outline:none;color:var(--text);width:100%;font-size:14px;}
  .explore-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;}
  .explore-grid .cell{aspect-ratio:1/1;overflow:hidden;background:var(--bg);position:relative;cursor:pointer;}
  .explore-grid .cell img{width:100%;height:100%;object-fit:cover;display:block;}
  .explore-grid .cell .reel-flag{position:absolute;top:8px;right:8px;color:#fff;filter:drop-shadow(0 1px 3px rgba(0,0,0,.6));}
  .explore-grid .cell .reel-flag svg{width:16px;height:16px;}

  /* ---------- Reels ---------- */
  .reels-wrap{
    height:calc(100vh - 61px);max-width:420px;margin:0 auto;
    overflow-y:auto;scroll-snap-type:y mandatory;
    border-left:1px solid var(--border);border-right:1px solid var(--border);
    scrollbar-width:none;background:#000;
  }
  .reels-wrap::-webkit-scrollbar{display:none;}
  .reel{
    height:calc(100vh - 61px);scroll-snap-align:start;position:relative;
    display:flex;align-items:center;justify-content:center;background:#000;
  }
  .reel img{width:100%;height:100%;object-fit:cover;}
  .reel-overlay-bottom{
    position:absolute;left:0;right:64px;bottom:0;padding:18px 14px;color:#fff;
    background:linear-gradient(to top, rgba(0,0,0,.55), transparent);
  }
  .reel-overlay-bottom .u{font-weight:600;font-size:14px;margin-bottom:4px;display:flex;align-items:center;gap:8px;}
  .reel-overlay-bottom .u img{width:26px;height:26px;border-radius:50%;object-fit:cover;}
  .reel-overlay-bottom .cap{font-size:13px;opacity:.9;}
  .reel-rail{
    position:absolute;right:10px;bottom:70px;display:flex;flex-direction:column;align-items:center;gap:18px;color:#fff;
  }
  .reel-rail button{background:none;border:none;color:#fff;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px;font-weight:600;}
  .reel-rail svg{width:27px;height:27px;}
  .reel-rail .liked svg{fill:var(--like);stroke:var(--like);}
  .reel-rail .saved svg{fill:#fff;}
  .reel-badge{position:absolute;top:14px;left:14px;color:#fff;font-size:12px;font-weight:600;display:flex;align-items:center;gap:5px;background:rgba(0,0,0,.35);padding:4px 9px;border-radius:20px;}
  .reel-badge svg{width:13px;height:13px;}

  /* ---------- Messages ---------- */
  .msg-row{display:flex;align-items:center;gap:12px;padding:10px 4px;cursor:pointer;border-radius:10px;}
  .msg-row:hover{background:var(--surface);}
  .msg-row img{width:52px;height:52px;border-radius:50%;object-fit:cover;flex-shrink:0;}
  .msg-row .body{flex:1;min-width:0;}
  .msg-row .u{font-size:14px;font-weight:600;}
  .msg-row .last{font-size:13px;color:var(--text-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:220px;}
  .msg-row.unread .last{color:var(--text);font-weight:600;}
  .msg-row .dot{width:8px;height:8px;border-radius:50%;background:var(--accent-d);flex-shrink:0;}
  .chat-head{display:flex;align-items:center;gap:12px;padding:6px 4px 16px;border-bottom:1px solid var(--border);margin-bottom:14px;}
  .chat-head button{background:none;border:none;color:var(--text);}
  .chat-head img{width:34px;height:34px;border-radius:50%;object-fit:cover;}
  .chat-head .u{font-weight:600;font-size:14.5px;}
  .chat-thread{display:flex;flex-direction:column;gap:8px;padding:4px 2px 16px;min-height:260px;}
  .bubble{max-width:75%;padding:9px 13px;border-radius:18px;font-size:14px;line-height:1.35;}
  .bubble.them{background:var(--surface);border:1px solid var(--border);align-self:flex-start;border-bottom-left-radius:4px;}
  .bubble.me{background:var(--accent-d);color:#fff;align-self:flex-end;border-bottom-right-radius:4px;}
  .chat-input-row{display:flex;gap:10px;align-items:center;position:sticky;bottom:0;background:var(--bg);padding:10px 0;}
  .chat-input-row input{
    flex:1;border:1px solid var(--border);border-radius:22px;padding:10px 16px;background:var(--surface);
    color:var(--text);outline:none;font-size:14px;
  }
  .chat-input-row button{background:none;border:none;color:var(--accent-d);font-weight:600;font-size:14px;}

  /* ---------- Notifications ---------- */
  .notif-section-label{font-size:14px;font-weight:600;margin:18px 4px 8px;}
  .notif-row{display:flex;align-items:center;gap:12px;padding:8px 4px;}
  .notif-row img.avt{width:44px;height:44px;border-radius:50%;object-fit:cover;flex-shrink:0;}
  .notif-row .text{flex:1;font-size:13.5px;line-height:1.4;}
  .notif-row .text b{font-weight:600;}
  .notif-row .time{color:var(--text-soft);}
  .notif-row .thumb{width:44px;height:44px;border-radius:4px;object-fit:cover;flex-shrink:0;}
  .notif-row .follow-btn{background:var(--accent-d);color:#fff;border:none;padding:7px 16px;border-radius:8px;font-size:13px;font-weight:600;flex-shrink:0;}
  .notif-icon{width:44px;height:44px;border-radius:50%;background:var(--ring);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .notif-icon svg{width:22px;height:22px;fill:#fff;}

  /* ---------- Profile page ---------- */
  .profile-header{display:flex;gap:34px;align-items:flex-start;padding:24px 6px;}
  .profile-header img{width:90px;height:90px;border-radius:50%;object-fit:cover;flex-shrink:0;}
  .profile-header h2{font-size:20px;font-weight:400;margin:0 0 12px;display:flex;align-items:center;flex-wrap:wrap;gap:10px;}
  .profile-stats{display:flex;gap:26px;font-size:14px;margin-bottom:10px;}
  .profile-stats b{font-weight:600;}
  .profile-bio{font-size:14px;line-height:1.4;}
  .profile-bio b{display:block;}
  .profile-tabs{display:flex;justify-content:center;gap:50px;border-top:1px solid var(--border);margin-top:20px;}
  .profile-tabs button{background:none;border:none;color:var(--text-soft);font-size:12px;font-weight:600;letter-spacing:.5px;padding:14px 0;border-top:1.5px solid transparent;margin-top:-1px;display:flex;align-items:center;gap:6px;}
  .profile-tabs button.active{color:var(--text);border-top-color:var(--text);}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;}
  .grid .cell{aspect-ratio:1/1;overflow:hidden;background:var(--bg);}
  .grid .cell img{width:100%;height:100%;object-fit:cover;display:block;}
  .toggle-theme{background:none;border:1px solid var(--border);border-radius:8px;padding:8px 12px;font-size:13px;color:var(--text);display:flex;align-items:center;gap:6px;}

  .empty-note{text-align:center;padding:60px 20px;color:var(--text-soft);font-size:14px;}

  @media(min-width:700px){ .search{display:flex;} }
  @media(min-width:900px){
    .side-col{display:block;}
    .bottomnav{display:none;}
    body{padding-bottom:0;}
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-inner">
    <a class="logo" href="#" onclick="showView('feed');return false;">Pulse</a>
    <div class="search">
      <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input id="search-top" placeholder="Search" oninput="onSearch(this.value,this)" onfocus="showView('explore')">
    </div>
    <div class="top-icons">
      <button class="icon-btn" onclick="showView('feed')" title="Home">

/* ---------------- Persistence (shared + personal storage) ---------------- */
async function saveSharedPosts(){
  try{ await window.storage.set('posts-v1', JSON.stringify(posts), true); }
  catch(e){ console.error('save posts failed', e); }
}
async function saveSharedStories(){
  try{ await window.storage.set('stories-v1', JSON.stringify(storiesContent), true); }
  catch(e){ console.error('save stories failed', e); }
}
async function savePersonal(){
  meData.profile = { name: ME.name, u: ME.u, avatar: ME.avatar };
  meData.myStoryItems = (storiesContent[ME.u] && storiesContent[ME.u].items) || [];
  meData.conversations = conversations;
  try{ await window.storage.set('me-data', JSON.stringify(meData), false); }
  catch(e){ console.error('save personal data failed', e); }
}

async function loadAllData(){
  // Shared posts
  try{
    const r = await window.storage.get('posts-v1', true);
    posts = r && r.value ? JSON.parse(r.value) : seedPosts();
  }catch(e){ posts = seedPosts(); }
  if(!posts || !posts.length){ posts = seedPosts(); }

  // Shared stories
  try{
    const r = await window.storage.get('stories-v1', true);
    storiesContent = r && r.value ? JSON.parse(r.value) : null;
  }catch(e){ storiesContent = null; }
  if(!storiesContent){
    storiesContent = {};
    SEED_STORY_USERS.forEach(s=>{ storiesContent[s.u] = {avatar:s.avatar, items:s.items}; });
    saveSharedStories();
  }

  // Personal data
  try{
    const r = await window.storage.get('me-data', false);
    if(r && r.value) meData = Object.assign(meData, JSON.parse(r.value));
  }catch(e){ /* first time visitor, defaults stand */ }

  if(meData.profile){
    ME.name = meData.profile.name || ME.name;
    ME.u = meData.profile.u || ME.u;
    ME.avatar = meData.profile.avatar || ME.avatar;
  }
  conversations = meData.conversations && meData.conversations.length ? meData.conversations : seedConversations();
  if(meData.myStoryItems && meData.myStoryItems.length && !(storiesContent[ME.u] && storiesContent[ME.u].items.length)){
    storiesContent[ME.u] = { avatar: ME.avatar, items: meData.myStoryItems };
  }

  // Apply personal liked/saved flags onto the shared posts
  posts.forEach(p=>{
    p.liked = meData.likedPosts.includes(p.id);
    p.saved = meData.savedPosts.includes(p.id);
  });

  dataReady = true;
}

function renderMessages(){

function openChat(id){
  activeChatId = id;
  const c = conversations.find(x=>x.id===id);
  c.unread = false;
  renderChat();
  updateMsgDot();
  savePersonal();
}

function renderChat(){
  const c = conversations.find(x=>x.id===activeChatId);
  document.getElementById('main-col').innerHTML =
    '<div class="chat-head">' +
      '<button onclick="activeChatId=null;renderMessages()">' +
        '<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>' +
      '</button>' +
      '<img src="'+c.avatar+'"><span class="u">'+c.u+'</span>' +
    '</div>' +
    '<div class="chat-thread" id="chat-thread">' +
      c.messages.map(m=>'<div class="bubble '+(m.from==='me'?'me':'them')+'">'+m.t+'</div>').join('') +
    '</div>' +
    '<div class="chat-input-row">' +
      '<input id="chat-input" placeholder="Message..." onkeydown="if(event.key===\'Enter\')sendChat()">' +
      '<button onclick="sendChat()">Send</button>' +
    '</div>';
}

function sendChat(){
  const input = document.getElementById('chat-input');
  const text = input.value.trim();
  if(!text) return;
  const c = conversations.find(x=>x.id===activeChatId);
  c.messages.push({from:'me', t:text});
  input.value='';
  renderChat();
  savePersonal();
  setTimeout(()=>{
    c.messages.push({from:'them', t: cannedReplies[Math.floor(Math.random()*cannedReplies.length)]});
    if(activeChatId===c.id) renderChat(); else c.unread = true;
    updateMsgDot();
    savePersonal();
  }, 1100 + Math.random()*900);
}

function updateMsgDot(){
  const any = conversations.some(c=>c.unread);
  document.getElementById('msg-dot').style.display = any? 'block':'none';
}

function messageUser(username){
  let c = conversations.find(x=>x.u===username);
  if(!c){
    const seed = posts.find(p=>p.user===username);
    const storyEntry = storiesContent[username];
    const avatar = (seed && seed.avatar) || (storyEntry && storyEntry.avatar) || 'https://i.pravatar.cc/64';
    c = {id: Date.now(), u: username, avatar, unread:false, messages:[]};
    conversations.unshift(c);
    savePersonal();
  }
  showView('messages');
  openChat(c.id);
}

/* ---------------- View switching ---------------- */
function showView(v){
  currentView = v;
  activeChatId = null;
  const app = document.getElementById('app');
  app.classList.remove('full','wide');
  ['nav-feed','nav-explore','nav-reels','nav-profile'].forEach(id=>document.getElementById(id).classList.remove('active'));
  if(v==='feed'){ renderFeed(); document.getElementById('nav-feed').classList.add('active'); }
  else if(v==='explore'){ renderExplore(); document.getElementById('nav-explore').classList.add('active'); }
  else if(v==='reels'){ app.classList.add('full'); renderReels(); document.getElementById('nav-reels').classList.add('active'); }
  else if(v==='messages'){ app.classList.add('wide'); renderMessages(); }
  else if(v==='notifications'){ renderNotifications(); }
  else if(v==='profile'){ renderProfile(); document.getElementById('nav-profile').classList.add('active'); }
  window.scrollTo({top:0,behavior:'smooth'});
}

function refresh(){
  if(currentView==='feed') renderFeed();
  else if(currentView==='explore') renderExploreGrid();
  else if(currentView==='reels') renderReels();
  else if(currentView==='profile') renderProfile();
  else if(currentView==='otherProfile' && lastViewedProfile) renderOtherProfile(lastViewedProfile);
  if(postModalOpenId!==null) document.getElementById('post-modal-content').innerHTML = renderPost(findPost(postModalOpenId));
}

/* ---------------- Post interactions ---------------- */
function likePost(id, fromDblClick){
  const p = findPost(id);
  const idx = meData.likedPosts.indexOf(id);
  if(fromDblClick){
    if(!p.liked){
      p.liked=true; p.likes++;
      meData.likedPosts.push(id);
      const b = document.getElementById('burst-'+id);
      if(b){ b.classList.remove('play'); void b.offsetWidth; b.classList.add('play'); }
    }
  } else {
    p.liked = !p.liked;
    p.likes += p.liked ? 1 : -1;
    if(p.liked) meData.likedPosts.push(id);
    else if(idx>-1) meData.likedPosts.splice(idx,1);
  }
  refresh();
  saveSharedPosts();
  savePersonal();
}
function savePost(id){
  const p = findPost(id);
  p.saved = !p.saved;
  const idx = meData.savedPosts.indexOf(id);
  if(p.saved && idx===-1) meData.savedPosts.push(id);
  else if(!p.saved && idx>-1) meData.savedPosts.splice(idx,1);
  refresh();
  savePersonal();
}
function focusComment(id){ const el=document.getElementById('comment-input-'+id); if(el) el.focus(); }
function toggleCommentBtn(id){
  const input = document.getElementById('comment-input-'+id);
  const btn = document.getElementById('comment-btn-'+id);
  btn.classList.toggle('enabled', input.value.trim().length>0);
}
function addComment(id){
  const input = document.getElementById('comment-input-'+id);
  const text = input.value.trim();
  if(!text) return;
  findPost(id).comments.push({u:ME.u, t:text});
  refresh();
  saveSharedPosts();
}

/* ---------------- Story viewer ---------------- */
let svUser = null, svIndex = 0, svTimer = null;
const SV_DURATION = 4500;

function getStoryUser(u){
  if(u===ME.u){
    const mine = storiesContent[ME.u] || {avatar:ME.avatar, items:[]};
    return {u:ME.u, avatar:ME.avatar, items:mine.items, mine:true};
  }
  const s = storiesContent[u];
  return s ? {u, avatar:s.avatar, items:s.items, mine:false} : {items:[]};
}

function openStoryViewer(u){
  svUser = getStoryUser(u);
  if(!svUser.items || svUser.items.length===0) return;
  svIndex = 0;
  document.getElementById('story-viewer').classList.add('open');
  document.getElementById('sv-uname').textContent = svUser.u;
  document.getElementById('sv-avatar').src = svUser.avatar;
  document.getElementById('sv-delete').style.display = svUser.mine ? 'flex' : 'none';
  playStory();
  document.addEventListener('keydown', svKeyHandler);
}

function svKeyHandler(e){
  if(e.key==='ArrowRight') storyNext();
  else if(e.key==='ArrowLeft') storyPrev();
  else if(e.key==='Escape') closeStoryViewer();
}

function renderSvBars(){
  const bars = document.getElementById('sv-bars');
  bars.innerHTML = svUser.items.map((_,i)=>
    '<div class="sv-bar"><div class="sv-bar-fill '+(i<svIndex?'done':'')+'" id="sv-fill-'+i+'"></div></div>'
  ).join('');
}

function playStory(){
  clearTimeout(svTimer);
  renderSvBars();
  const item = svUser.items[svIndex];
  document.getElementById('sv-image').src = item.img;
  document.getElementById('sv-time').textContent = item.time || '';
  const fill = document.getElementById('sv-fill-'+svIndex);
  if(fill){
    fill.style.animationDuration = SV_DURATION+'ms';
    fill.classList.add('playing');
  }
  svTimer = setTimeout(storyNext, SV_DURATION);
}

function storyNext(){
  if(svIndex < svUser.items.length-1){ svIndex++; playStory(); }
  else { markCurrentSeen(); closeStoryViewer(); }
}
function storyPrev(){
  if(svIndex>0){ svIndex--; playStory(); }
}
function markCurrentSeen(){
  if(!svUser.mine && svUser.u && !meData.seenStories.includes(svUser.u)){
    meData.seenStories.push(svUser.u);
    savePersonal();
    if(currentView==='feed') renderFeed();
  }
}
function closeStoryViewer(){
  clearTimeout(svTimer);
  markCurrentSeen();
  document.getElementById('story-viewer').classList.remove('open');
  document.removeEventListener('keydown', svKeyHandler);
}

/* ---------------- Create modal (post or story) ---------------- */
function openCreateModal(tab){
  setCreateTab(tab || 'post');
  document.getElementById('create-modal').classList.add('open');
}
function setCreateTab(tab){
  createTab = tab;
  document.getElementById('tab-post').classList.toggle('active', tab==='post');
  document.getElementById('tab-story').classList.toggle('active', tab==='story');
  document.getElementById('create-title').textContent = tab==='post' ? 'Create new post' : 'Add to your story';
  document.getElementById('caption-input').style.display = tab==='post' ? 'block' : 'none';
  document.getElementById('share-btn').textContent = tab==='post' ? 'Share' : 'Add to story';
}
function closeCreateModal(){
  document.getElementById('create-modal').classList.remove('open');
  document.getElementById('drop-zone').style.display='flex';
  document.getElementById('preview-img').style.display='none';
  document.getElementById('caption-input').value='';
  document.getElementById('file-input').value='';
  document.getElementById('share-btn').disabled = true;
  pendingImage = null;
}
document.getElementById('file-input').addEventListener('change', e=>{
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = ev=>{
    pendingImage = ev.target.result;
    const img = document.getElementById('preview-img');
    img.src = pendingImage;
    img.style.display='block';
    document.getElementById('drop-zone').style.display='none';
    document.getElementById('share-btn').disabled = false;
  };
  reader.readAsDataURL(file);
});

function publishCreate(){
  if(!pendingImage) return;
  if(createTab==='post'){
    const caption = document.getElementById('caption-input').value.trim();
    const newId = Date.now();
    posts.unshift(mkPost(newId, ME.u, ME.avatar, '', pendingImage, caption, false, false, 0, [], 'JUST NOW', ['feed','explore']));
    closeCreateModal();
    showView('feed');
    saveSharedPosts();
  } else {
    if(!storiesContent[ME.u]) storiesContent[ME.u] = {avatar: ME.avatar, items:[]};
    storiesContent[ME.u].avatar = ME.avatar;
    storiesContent[ME.u].items.push({img: pendingImage, time:'now'});
    closeCreateModal();
    renderFeed();
    saveSharedStories();
    savePersonal();
  }
}

/* ---------------- New-user onboarding ---------------- */
let pendingObAvatar = null;
document.getElementById('ob-file-input').addEventListener('change', e=>{
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = ev=>{
    pendingObAvatar = ev.target.result;
    document.getElementById('ob-avatar-preview').src = pendingObAvatar;
  };
  reader.readAsDataURL(file);
});
function finishOnboarding(skip){
  if(!skip){
    const n = document.getElementById('ob-name-input').value.trim();
    const u = document.getElementById('ob-username-input').value.trim();
    if(n) ME.name = n;
    if(u) renameMe(u.replace(/\s+/g,'').toLowerCase());
    if(pendingObAvatar) ME.avatar = pendingObAvatar;
  }
  meData.onboarded = true;
  updateMeUI();
  refresh();
  savePersonal();
  document.getElementById('onboarding-overlay').classList.remove('open');
}

/* ---------------- Edit profile ---------------- */
let pendingAvatar = null;
function openEditProfile(){
  document.getElementById('ep-avatar-preview').src = ME.avatar;
  document.getElementById('ep-name-input').value = ME.name;
  document.getElementById('ep-username-input').value = ME.u;
  pendingAvatar = null;
  document.getElementById('edit-profile-modal').classList.add('open');
}
function closeEditProfile(){
  document.getElementById('edit-profile-modal').classList.remove('open');
}
document.getElementById('ep-file-input').addEventListener('change', e=>{
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = ev=>{
    pendingAvatar = ev.target.result;
    document.getElementById('ep-avatar-preview').src = pendingAvatar;
  };
  reader.readAsDataURL(file);
});
// Moves your story-content entry when your username changes, so it isn't orphaned under the old name.
function renameMe(newUsername){
  if(newUsername === ME.u) return;
  const old = ME.u;
  if(storiesContent[old]){
    storiesContent[newUsername] = storiesContent[old];
    delete storiesContent[old];
    saveSharedStories();
  }
  ME.u = newUsername;
}
function saveProfile(){
  const newName = document.getElementById('ep-name-input').value.trim();
  const newUsername = document.getElementById('ep-username-input').value.trim();
  if(newName) ME.name = newName;
  if(newUsername) renameMe(newUsername);
  if(pendingAvatar){
    ME.avatar = pendingAvatar;
    if(storiesContent[ME.u]) storiesContent[ME.u].avatar = ME.avatar;
  }
  updateMeUI();
  closeEditProfile();
  refresh();
  savePersonal();
  saveSharedStories();
}
function updateMeUI(){
  document.getElementById('topbar-avatar').src = ME.avatar;
  document.getElementById('bottomnav-avatar').src = ME.avatar;
  document.getElementById('sidecol-avatar').src = ME.avatar;
  document.getElementById('sidecol-uname').textContent = ME.u;
  document.getElementById('sidecol-name').textContent = ME.name;
}

/* ---------------- Delete post ---------------- */
function postMenu(id){
  const p = findPost(id);
  if(!p) return;
  if(p.user !== ME.u){
    alert('Reporting and unfollowing aren\'t wired up in this demo — only your own posts can be deleted here.');
    return;
  }
  if(!confirm('Delete this post? This can\'t be undone.')) return;
  posts = posts.filter(x=>x.id!==id);
  if(postModalOpenId===id) closePostModal();
  refresh();
  if(currentView==='profile') renderProfile();
  saveSharedPosts();
}

/* ---------------- Delete story item ---------------- */
function deleteStoryItem(){
  if(!svUser || !svUser.mine) return;
  if(!confirm('Delete this story?')) return;
  const mine = storiesContent[ME.u];
  if(!mine) return;
  mine.items.splice(svIndex,1);
  if(mine.items.length===0){
    delete storiesContent[ME.u];
    closeStoryViewer();
    renderFeed();
    saveSharedStories();
    savePersonal();
    return;
  }
  svUser.items = mine.items;
  if(svIndex>=mine.items.length) svIndex = mine.items.length-1;
  playStory();
  saveSharedStories();
  savePersonal();
}

/* ---------------- Theme ---------------- */
function toggleTheme(){
  theme = theme==='light' ? 'dark' : 'light';
  document.documentElement.classList.toggle('dark', theme==='dark');
}

/* ---------------- Global escape-to-close ---------------- */
document.addEventListener('keydown', e=>{
  if(e.key !== 'Escape') return;
  if(document.getElementById('post-modal').classList.contains('open')) closePostModal();
  else if(document.getElementById('create-modal').classList.contains('open')) closeCreateModal();
  else if(document.getElementById('edit-profile-modal').classList.contains('open')) closeEditProfile();
});

/* ---------------- Init ---------------- */
async function init(){
  document.getElementById('main-col').innerHTML = '<div class="empty-note">Loading your feed…</div>';
  await loadAllData();
  updateMeUI();
  renderFeed();
  renderSuggestions();
  updateMsgDot();
  document.getElementById('nav-feed').classList.add('active');
  if(meData.onboarded){
    document.getElementById('onboarding-overlay').classList.remove('open');
  } else {
    document.getElementById('ob-username-input').value = '';
    document.getElementById('ob-name-input').value = '';
  }
}
init();
</script>
